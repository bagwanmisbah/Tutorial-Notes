<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellspacing vs Cellpadding</title>
</head>

<body>

  <h2>Table with Cellspacing and Cellpadding</h2>

  <table border="1" cellspacing="10" cellpadding="15">
    <tr>
      <th>Name</th>
      <th>Age</th>
    </tr>
    <tr>
      <td>John</td>
      <td>25</td>
    </tr>
    <tr>
      <td>Sarah</td>
      <td>22</td>
    </tr>
  </table>

</body>

</html>
