<!DOCTYPE html>
<html>

<head>
  <title>Simple Table</title>
</head>

<body>

  <table border="1">
    <caption>Student Details</caption>
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>Marks</th>
    </tr>
    <tr>
      <td>John</td>
      <td>20</td>
      <td>92.45%</td>
    </tr>
    <tr>
      <td>Mary</td>
      <td>22</td>
      <td>96.81%</td>
    </tr>
    <tr>
      <td>Alice</td>
      <td>24</td>
      <td>97.32%</td>
    </tr>
  </table>

</body>

</html>
